# Tema base do Sistema Comportamento — modo ESCURO.
# Fundo = navy exato do PPT (#0C2539). Accent = teal exato da marca (#03857B).
# Ajuste fino visual (nav, cartões, botões, hovers) em ferramentas/estilo.py.

[theme]
base = "dark"
primaryColor = "#03857B"
backgroundColor = "#0C2539"
secondaryBackgroundColor = "#112E46"
textColor = "#EAF1F8"
borderColor = "#244B6B"
baseFontSize = 15
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "'Space Grotesk':https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap"

[theme.sidebar]
backgroundColor = "#0E2A40"
